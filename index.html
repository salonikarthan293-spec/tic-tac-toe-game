<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>XOX - Tic Tac Toe</title>
  <style>
    :root {
      --bg-1: #0f172a;
      --bg-2: #111827;
      --panel: rgba(15, 23, 42, 0.7);
      --panel-2: rgba(30, 41, 59, 0.8);
      --card: rgba(17, 24, 39, 0.8);
      --text: #e5eefb;
      --muted: #b4c4df;
      --accent: #7c3aed;
      --accent-2: #22c55e;
      --accent-3: #f59e0b;
      --accent-4: #ef4444;
      --x-color: #60a5fa;
      --o-color: #f472b6;
      --shadow: 0 20px 45px rgba(0, 0, 0, 0.35);
      --cell-size: min(22vw, 120px);
      --board-size: calc(var(--cell-size) * 3);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(124, 58, 237, 0.35), transparent 30%),
        radial-gradient(circle at bottom right, rgba(34, 197, 94, 0.26), transparent 30%),
        linear-gradient(135deg, var(--bg-1), var(--bg-2));
      color: var(--text);
    }

    .app {
      width: min(92vw, 880px);
      background: rgba(15, 23, 42, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 28px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      padding: 24px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-mark {
      width: 45px;
      height: 45px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--accent), #8b5cf6);
      box-shadow: 0 10px 20px rgba(124, 58, 237, 0.45);
      font-weight: 900;
      font-size: 1.2rem;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.5rem, 2vw, 2.3rem);
      letter-spacing: 0.04em;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .mode-switch, .action-btn {
      border: 0;
      border-radius: 12px;
      padding: 10px 14px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s ease, filter 0.2s ease, opacity 0.2s ease;
      color: var(--text);
    }

    .action-btn:hover, .mode-switch:hover {
      transform: translateY(-1px);
      filter: brightness(1.08);
    }

    .mode-switch {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
    }

    .mode-switch.active {
      background: linear-gradient(135deg, var(--accent), #8b5cf6);
      box-shadow: 0 10px 20px rgba(124, 58, 237, 0.4);
    }

    .action-btn {
      background: linear-gradient(135deg, #0ea5e9, #3b82f6);
      box-shadow: 0 12px 20px rgba(59, 130, 246, 0.35);
    }

    .scoreboard {
      display: grid;
      grid-template-columns: repeat(3, minmax(120px, 1fr));
      gap: 14px;
      margin-bottom: 22px;
    }

    .score-box {
      background: var(--panel);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      padding: 14px 16px;
      text-align: center;
      min-height: 96px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .score-box::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(120deg, transparent, rgba(255,255,255,0.06), transparent);
      transform: translateX(-100%);
      animation: shine 5s linear infinite;
    }

    @keyframes shine {
      0% { transform: translateX(-100%); }
      50% { transform: translateX(100%); }
      100% { transform: translateX(100%); }
    }

    .score-label {
      color: var(--muted);
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .score-value {
      font-size: clamp(2rem, 3vw, 2.8rem);
      font-weight: 800;
      margin-top: 6px;
    }

    .score-box.x .score-value { color: var(--x-color); }
    .score-box.o .score-value { color: var(--o-color); }
    .score-box.draw .score-value { color: var(--accent-3); }

    .game-wrap {
      display: grid;
      grid-template-columns: 1fr minmax(240px, 300px);
      gap: 20px;
      align-items: center;
    }

    .board-panel {
      background: var(--card);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 28px;
      padding: 18px;
      display: grid;
      place-items: center;
      min-height: 430px;
      position: relative;
    }

    .board {
      width: var(--board-size);
      height: var(--board-size);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      position: relative;
    }

    .cell {
      width: var(--cell-size);
      height: var(--cell-size);
      border: 0;
      border-radius: 22px;
      background: linear-gradient(180deg, rgba(148,163,184,0.12), rgba(51,65,85,0.4));
      color: var(--text);
      font-size: clamp(2.2rem, 5vw, 4rem);
      font-weight: 900;
      cursor: pointer;
      transition: transform 0.12s ease, box-shadow 0.2s ease, background 0.2s ease;
      position: relative;
      box-shadow: inset 0 1px 2px rgba(255,255,255,0.04);
    }

    .cell:hover:not(:disabled) {
      transform: translateY(-1px);
      background: linear-gradient(180deg, rgba(96,165,250,0.18), rgba(51,65,85,0.5));
    }

    .cell:disabled {
      cursor: default;
    }

    .cell.x {
      color: var(--x-color);
      text-shadow: 0 0 18px rgba(96,165,250,0.8);
    }

    .cell.o {
      color: var(--o-color);
      text-shadow: 0 0 18px rgba(244,114,182,0.8);
    }

    .cell.win {
      background: linear-gradient(180deg, rgba(34,197,94,0.25), rgba(21,128,61,0.5));
      box-shadow: 0 0 0 2px rgba(34,197,94,0.4), 0 10px 20px rgba(34,197,94,0.22);
      animation: pulseWin 0.6s ease-in-out infinite alternate;
    }

    @keyframes pulseWin {
      from { transform: scale(1); }
      to { transform: scale(1.04); }
    }

    .panel-side {
      background: var(--panel-2);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 24px;
      padding: 18px 16px;
    }

    .status {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 12px;
      min-height: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .status-text {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--muted);
    }

    .status-text strong {
      display: block;
      font-size: 1.35rem;
      margin-top: 6px;
      letter-spacing: 0.05em;
      color: var(--text);
    }

    .legend {
      margin-top: 16px;
      display: grid;
      gap: 12px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 10px;
      border-radius: 12px;
      background: rgba(255,255,255,0.02);
    }

    .legend-item span:first-child {
      color: var(--muted);
    }

    .token {
      font-weight: 800;
      font-size: 1.2rem;
    }

    .token.x { color: var(--x-color); }
    .token.o { color: var(--o-color); }

    .hidden {
      display: none !important;
    }

    @media (max-width: 760px) {
      .game-wrap {
        grid-template-columns: 1fr;
      }

      .board-panel {
        min-height: 360px;
      }

      .scoreboard {
        grid-template-columns: repeat(3, minmax(90px, 1fr));
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="brand">
        <div class="brand-mark">X</div>
        <h1>XOX</h1>
      </div>

      <div class="controls">
        <button class="mode-switch active" data-mode="pvp">Player vs Player</button>
        <button class="mode-switch" data-mode="pvc">Player vs Computer</button>
        <button class="action-btn" id="resetBtn">Restart</button>
      </div>
    </div>

    <div class="scoreboard">
      <div class="score-box x">
        <div class="score-label">Player X</div>
        <div class="score-value" id="scoreX">0</div>
      </div>

      <div class="score-box draw">
        <div class="score-label">Draws</div>
        <div class="score-value" id="scoreDraw">0</div>
      </div>

      <div class="score-box o">
        <div class="score-label" id="playerOLabel">Player O</div>
        <div class="score-value" id="scoreO">0</div>
      </div>
    </div>

    <div class="game-wrap">
      <div class="board-panel">
        <div class="board" id="board" aria-label="Tic tac toe board">
          <button class="cell" data-index="0" aria-label="Cell 1"></button>
          <button class="cell" data-index="1" aria-label="Cell 2"></button>
          <button class="cell" data-index="2" aria-label="Cell 3"></button>
          <button class="cell" data-index="3" aria-label="Cell 4"></button>
          <button class="cell" data-index="4" aria-label="Cell 5"></button>
          <button class="cell" data-index="5" aria-label="Cell 6"></button>
          <button class="cell" data-index="6" aria-label="Cell 7"></button>
          <button class="cell" data-index="7" aria-label="Cell 8"></button>
          <button class="cell" data-index="8" aria-label="Cell 9"></button>
        </div>
      </div>

      <aside class="panel-side">
        <div class="status">
          <div class="status-text">
            Current turn
            <strong id="statusText">Player X</strong>
          </div>
        </div>

        <div class="legend">
          <div class="legend-item">
            <span>Player X</span>
            <span class="token x">X</span>
          </div>
          <div class="legend-item">
            <span id="legendOText">Player O</span>
            <span class="token o">O</span>
          </div>
        </div>
      </aside>
    </div>
  </div>

  <script>
    const WINNING_COMBOS = [
      [0, 1, 2],
      [3, 4, 5],
      [6, 7, 8],
      [0, 3, 6],
      [1, 4, 7],
      [2, 5, 8],
      [0, 4, 8],
      [2, 4, 6]
    ];

    const state = {
      board: Array(9).fill(""),
      currentPlayer: "X",
      mode: "pvp",
      scores: { X: 0, O: 0, draw: 0 },
      gameOver: false
    };

    const boardEl = document.getElementById("board");
    const cells = [...document.querySelectorAll(".cell")];
    const statusText = document.getElementById("statusText");
    const scoreXEl = document.getElementById("scoreX");
    const scoreOEl = document.getElementById("scoreO");
    const scoreDrawEl = document.getElementById("scoreDraw");
    const resetBtn = document.getElementById("resetBtn");
    const modeButtons = [...document.querySelectorAll(".mode-switch")];
    const playerOLabel = document.getElementById("playerOLabel");
    const legendOText = document.getElementById("legendOText");

    function updateScoreboard() {
      scoreXEl.textContent = state.scores.X;
      scoreOEl.textContent = state.scores.O;
      scoreDrawEl.textContent = state.scores.draw;
    }

    function setMode(nextMode) {
      state.mode = nextMode;
      modeButtons.forEach(btn => {
        btn.classList.toggle("active", btn.dataset.mode === nextMode);
      });

      if (nextMode === "pvc") {
        playerOLabel.textContent = "Computer";
        legendOText.textContent = "Computer";
      } else {
        playerOLabel.textContent = "Player O";
        legendOText.textContent = "Player O";
      }

      resetBoard();
    }

    function resetBoard() {
      state.board = Array(9).fill("");
      state.currentPlayer = "X";
      state.gameOver = false;

      cells.forEach(cell => {
        cell.textContent = "";
        cell.classList.remove("x", "o", "win");
        cell.disabled = false;
      });

      statusText.textContent = state.mode === "pvc" ? "Your turn (X)" : "Player X";
      statusText.style.color = "var(--muted)";
    }

    function declareWinner(winner, winningIndexes = []) {
      state.gameOver = true;
      state.scores[winner] += 1;
      updateScoreboard();

      cells.forEach((cell, idx) => {
        if (winningIndexes.includes(idx)) {
          cell.classList.add("win");
        }
        cell.disabled = true;
      });

      const winnerLabel = winner === "X"
        ? (state.mode === "pvc" ? "You win!" : "Player X wins!")
        : (state.mode === "pvc" ? "Computer wins!" : "Player O wins!");

      statusText.textContent = winnerLabel;
      statusText.style.color = winner === "X" ? "var(--x-color)" : "var(--o-color)";
    }

    function declareDraw() {
      state.gameOver = true;
      state.scores.draw += 1;
      updateScoreboard();

      cells.forEach(cell => cell.disabled = true);
      statusText.textContent = "Draw game!";
      statusText.style.color = "var(--accent-3)";
    }

    function evaluateWinner(board) {
      for (const combo of WINNING_COMBOS) {
        const [a, b, c] = combo;
        if (board[a] && board[a] === board[b] && board[a] === board[c]) {
          return { winner: board[a], combo };
        }
      }
      return null;
    }

    function isBoardFull(board) {
      return board.every(cell => cell !== "");
    }

    function handleMove(index) {
      if (state.board[index] || state.gameOver) return;

      state.board[index] = state.currentPlayer;
      const cell = cells[index];
      cell.textContent = state.currentPlayer;
      cell.classList.add(state.currentPlayer.toLowerCase());
      cell.disabled = true;

      const winnerInfo = evaluateWinner(state.board);

      if (winnerInfo) {
        declareWinner(winnerInfo.winner, winnerInfo.combo);
        return;
      }

      if (isBoardFull(state.board)) {
        declareDraw();
        return;
      }

      state.currentPlayer = state.currentPlayer === "X" ? "O" : "X";

      if (state.mode === "pvc" && state.currentPlayer === "O") {
        statusText.textContent = "Computer thinking...";
        statusText.style.color = "var(--muted)";
        setTimeout(computerMove, 420);
      } else {
        statusText.textContent = state.currentPlayer === "X"
          ? (state.mode === "pvc" ? "Your turn (X)" : "Player X")
          : "Player O";
        statusText.style.color = "var(--muted)";
      }
    }

    function getAvailableMoves(board) {
      return board
        .map((cell, idx) => (cell === "" ? idx : null))
        .filter(val => val !== null);
    }

    function minimax(board, currentTurn) {
      const winnerInfo = evaluateWinner(board);
      if (winnerInfo) {
        return winnerInfo.winner === "O" ? 10 : -10;
      }
      if (isBoardFull(board)) return 0;

      const moves = [];
      for (const index of getAvailableMoves(board)) {
        board[index] = currentTurn;
        const score = minimax(board, currentTurn === "O" ? "X" : "O");
        board[index] = "";
        moves.push({ index, score });
      }

      if (currentTurn === "O") {
        return Math.max(...moves.map(m => m.score));
      }
      return Math.min(...moves.map(m => m.score));
    }

    function bestComputerMove() {
      const board = [...state.board];
      const available = getAvailableMoves(board);
      let bestScore = -Infinity;
      let bestIndex = available[0];

      for (const index of available) {
        board[index] = "O";
        const score = minimax(board, "X");
        board[index] = "";
        if (score > bestScore) {
          bestScore = score;
          bestIndex = index;
        }
      }

      return bestIndex;
    }

    function computerMove() {
      if (state.gameOver) return;

      const index = bestComputerMove();
      handleMove(index);
    }

    cells.forEach(cell => {
      cell.addEventListener("click", () => {
        const index = Number(cell.dataset.index);
        if (state.mode === "pvc" && state.currentPlayer === "O") return;
        handleMove(index);
      });
    });

    modeButtons.forEach(button => {
      button.addEventListener("click", () => setMode(button.dataset.mode));
    });

    resetBtn.addEventListener("click", () => {
      resetBoard();
      updateScoreboard();
    });

    updateScoreboard();
    resetBoard();
  </script>
</body>
</html>
